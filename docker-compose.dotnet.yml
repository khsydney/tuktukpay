# Override: run the ledger as the .NET 8 implementation (zero-code Splunk OTel .NET).
#   docker compose -f docker-compose.yml -f docker-compose.dotnet.yml up -d --build ledger
services:
  ledger:
    build: ./services/ledger-dotnet
    environment:
      OTEL_SERVICE_NAME: ledger
      SPLUNK_PROFILER_ENABLED: "true"
      SPLUNK_PROFILER_MEMORY_ENABLED: "true"
      OTEL_DOTNET_AUTO_LOGS_INCLUDE_FORMATTED_MESSAGE: "true"
