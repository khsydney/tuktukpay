# Placeholders: ${IMAGE_REGISTRY} ${NAMESPACE} ${DEPLOYMENT_ENVIRONMENT} — k8s/apply.sh substitutes them.
apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
---
apiVersion: v1
kind: Secret
metadata:
  name: tuktukpay-db
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  DATABASE_URL: postgres://tuktukpay:tuktukpay@postgres:5432/tuktukpay
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tuktukpay-db-init
  namespace: ${NAMESPACE}
data:
  init.sql: "-- TukTukPay ledger schema. Runs automatically on first start of the postgres container.\n\nCREATE TABLE IF NOT EXISTS merchants (\n    id        text PRIMARY KEY,\n    name      text NOT NULL,\n    country   text NOT NULL,\n    segment   text NOT NULL,\n    tier      text NOT NULL DEFAULT 'standard',\n    mcc       text\n);\n\nCREATE TABLE IF NOT EXISTS payments (\n    payment_id          text PRIMARY KEY,\n    merchant_id         text NOT NULL,\n    order_id            text,\n    amount              numeric(14,2) NOT NULL DEFAULT 0,\n    currency            text,\n    payment_method      text,\n    status              text NOT NULL,\n    acquirer            text,\n    auth_code           text,\n    decline_reason      text,\n    initiator           text NOT NULL DEFAULT 'human',\n    card_bin            text,\n    card_network        text,\n    customer_country    text,\n    risk_score          numeric(6,4),\n    risk_model_version  text,\n    created_at          timestamptz NOT NULL DEFAULT now(),\n    updated_at          timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS payments_merchant_created_idx ON payments (merchant_id, created_at DESC);\nCREATE INDEX IF NOT EXISTS payments_status_idx ON payments (status);\n\nCREATE TABLE IF NOT EXISTS ledger_entries (\n    id          bigserial PRIMARY KEY,\n    payment_id  text NOT NULL REFERENCES payments (payment_id) ON DELETE CASCADE,\n    account     text NOT NULL,\n    direction   text NOT NULL CHECK (direction IN ('debit', 'credit')),\n    amount      numeric(14,2) NOT NULL,\n    currency    text,\n    created_at  timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX IF NOT EXISTS ledger_entries_payment_idx ON ledger_entries (payment_id);\n\nINSERT INTO merchants (id, name, country, segment, tier, mcc) VALUES\n    ('thai-airways',    'Thai Airways',                   'TH', 'airline',       'enterprise', '3077'),\n    ('lazada-th',       'Lazada Thailand (marketplace)',  'TH', 'ecommerce',     'enterprise', '5399'),\n    ('grab',            'Grab (ride hailing)',            'TH', 'mobility',      'enterprise', '4121'),\n    ('cafe-amazon',     'Caf\u00e9 Amazon (F&B chain)',        'TH', 'fnb',           'sme',        '5814'),\n    ('centara-hotels',  'Centara Hotels & Resorts',       'TH', 'hospitality',   'standard',   '7011'),\n    ('garena',          'Garena (digital goods)',         'TH', 'digital_goods', 'standard',   '5816')\nON CONFLICT (id) DO NOTHING;\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: tuktukpay
        - name: POSTGRES_PASSWORD
          value: tuktukpay
        - name: POSTGRES_DB
          value: tuktukpay
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
      volumes:
      - name: init
        configMap:
          name: tuktukpay-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ${NAMESPACE}
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
