# Splunk Distribution of the OpenTelemetry Collector — agent config for the
# TukTukPay workshop stack. Based on the distro's default agent_config.yaml.
#
# The container derives SPLUNK_API_URL / SPLUNK_INGEST_URL / SPLUNK_HEC_URL /
# SPLUNK_HEC_TOKEN from SPLUNK_REALM + SPLUNK_ACCESS_TOKEN unless you override
# them (e.g. SPLUNK_HEC_URL pointing at your Splunk Cloud HEC for Log Observer Connect).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Host metrics of the machine running the workshop stack
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      disk:
      filesystem:
      memory:
      network:
      load:
      paging:
      processes:
  # Per-container CPU / memory / network for the Infrastructure view.
  # Needs /var/run/docker.sock mounted (see docker-compose.yml).
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 10s
    timeout: 5s
  # The collector's own metrics
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 10s
          static_configs:
            - targets: ["0.0.0.0:8888"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'otelcol_rpc_.*'
              action: drop
            - source_labels: [__name__]
              regex: 'otelcol_http_.*'
              action: drop
            - source_labels: [__name__]
              regex: 'otelcol_processor_batch_.*'
              action: drop

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: ${SPLUNK_MEMORY_LIMIT_MIB}
  batch:
    metadata_keys:
      - X-SF-Token
  resourcedetection:
    detectors: [env, system]
    override: true
  # Every team runs its own copy of the stack: deployment.environment is how you
  # filter to *your* team's services in Splunk APM.
  resource/add_environment:
    attributes:
      - action: upsert
        key: deployment.environment
        value: ${DEPLOYMENT_ENVIRONMENT}

  # Workshop plumbing: the services poll the chaos-controller every 2s. Drop those
  # spans at the collector so the service map only shows the payment platform.
  filter/drop-chaos-polling:
    error_mode: ignore
    traces:
      span:
        - 'attributes["server.address"] == "chaos-controller"'
        - 'attributes["net.peer.name"] == "chaos-controller"'
        - 'IsMatch(attributes["url.full"], ".*chaos-controller.*")'
        - 'IsMatch(attributes["http.url"], ".*chaos-controller.*")'
        - 'IsMatch(attributes["url.full"], ".*/flags$")'
        - 'IsMatch(attributes["http.url"], ".*/flags$")'

  # payment-router (Java) is instrumented with zero code changes; the agent captures
  # the business headers it sets. Promote them to clean, indexable span tags.
  transform/router-headers:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["payment.acquirer"], attributes["http.response.header.x-payment-acquirer"][0]) where attributes["http.response.header.x-payment-acquirer"] != nil
          - set(attributes["payment.acquirer"], attributes["http.response.header.x_payment_acquirer"][0]) where attributes["http.response.header.x_payment_acquirer"] != nil
          - set(attributes["route.attempts"], attributes["http.response.header.x-route-attempts"][0]) where attributes["http.response.header.x-route-attempts"] != nil
          - set(attributes["route.attempts"], attributes["http.response.header.x_route_attempts"][0]) where attributes["http.response.header.x_route_attempts"] != nil
          - set(attributes["route.failover"], attributes["http.response.header.x-route-failover"][0]) where attributes["http.response.header.x-route-failover"] != nil
          - set(attributes["route.failover"], attributes["http.response.header.x_route_failover"][0]) where attributes["http.response.header.x_route_failover"] != nil
          - set(attributes["payment.outcome"], attributes["http.response.header.x-route-outcome"][0]) where attributes["http.response.header.x-route-outcome"] != nil
          - set(attributes["payment.outcome"], attributes["http.response.header.x_route_outcome"][0]) where attributes["http.response.header.x_route_outcome"] != nil
          - delete_matching_keys(attributes, "^http\\.response\\.header\\.x[-_]route.*")
          - delete_matching_keys(attributes, "^http\\.response\\.header\\.x[-_]payment.*")

  # Logs: every service exports OTLP log records with trace_id / span_id and the
  # business attributes documented in docs/log-schema.md. Before they go to Splunk
  # Cloud Platform (HEC) we (1) make `source` the service name so SPL reads naturally
  # (source=payment-router) while service.name stays an indexed field for Related
  # Content, and (2) add a lowercase `severity` field, the key Log Observer Connect
  # recognises (values: debug, info, warn, error, critical).
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(resource.attributes["com.splunk.source"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
          - set(attributes["severity"], ConvertCase(severity_text, "lower")) where severity_text != nil
          - set(attributes["severity"], "warn") where attributes["severity"] == "warning"
          - set(attributes["severity"], "error") where attributes["severity"] == "severe" or attributes["severity"] == "err"
          - set(attributes["severity"], "critical") where attributes["severity"] == "fatal"
          - set(attributes["severity"], "info") where attributes["severity"] == "information" or attributes["severity"] == "info2" or attributes["severity"] == "info3" or attributes["severity"] == "info4"
          - set(attributes["severity"], "debug") where attributes["severity"] == "fine" or attributes["severity"] == "finer" or attributes["severity"] == "finest" or attributes["severity"] == "trace" or attributes["severity"] == "debug2" or attributes["severity"] == "debug3" or attributes["severity"] == "debug4"

exporters:
  # Metrics (+ trace/metric correlation) to Splunk Observability Cloud
  signalfx:
    access_token: ${SPLUNK_ACCESS_TOKEN}
    api_url: ${SPLUNK_API_URL}
    ingest_url: ${SPLUNK_INGEST_URL}
    sync_host_metadata: true
    correlation:
  # Traces to Splunk APM (100% of spans — NoSample)
  otlphttp:
    traces_endpoint: ${SPLUNK_INGEST_URL}/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  # Logs to Splunk Cloud Platform over HEC — Log Observer Connect then reads them
  # from Observability Cloud (docs/logs-setup.md). Set SPLUNK_HEC_URL / _TOKEN / _INDEX
  # in .env; without them the collector falls back to the O11y ingest endpoint, which
  # only works for orgs with the Observability Logs entitlement.
  #
  # Every OTLP log record becomes one HEC event: body -> event; trace_id, span_id,
  # severity and ALL resource + log attributes (service.name, deployment.environment,
  # payment.id, merchant.id ...) -> indexed `fields`. host.name -> host.
  splunk_hec:
    token: ${SPLUNK_HEC_TOKEN}
    endpoint: ${SPLUNK_HEC_URL}
    index: ${SPLUNK_HEC_INDEX}
    source: otel                   # overridden per record by com.splunk.source (= service.name)
    sourcetype: otel
    profiling_data_enabled: false
    timeout: 10s
    # Resilience: a dead HEC endpoint (wrong URL, IP allow list, 404) must never back
    # up into memory_limiter and make the collector refuse traces and metrics. Give up
    # on a batch after two minutes and keep the queue small.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 200
  # AlwaysOn Profiling data travels as OTLP logs to the O11y ingest endpoint
  splunk_hec/profiling:
    token: ${SPLUNK_ACCESS_TOKEN}
    endpoint: ${SPLUNK_INGEST_URL}/v1/log
    log_data_enabled: false
  debug:
    verbosity: basic
    sampling_initial: 2
    sampling_thereafter: 500

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-chaos-polling, transform/router-headers, batch, resourcedetection, resource/add_environment]
      exporters: [otlphttp, signalfx]
    metrics:
      receivers: [hostmetrics, otlp, prometheus/internal, docker_stats]
      processors: [memory_limiter, batch, resourcedetection, resource/add_environment]
      exporters: [signalfx]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/add_environment, transform/logs, batch]
      exporters: [splunk_hec, splunk_hec/profiling]
